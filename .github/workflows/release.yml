# Push a tag like v0.1.0 to release. Every check in ci.yml must pass first.
# Produces: a signed APK + SHA-256 on the GitHub Release, a build-provenance attestation
# (anyone can verify the APK was built by this workflow from this exact commit), and
# deploys the Global chat Worker.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  apk:
    name: Signed release APK
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write      # create the GitHub Release
      id-token: write      # build provenance
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.FRAMY_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::FRAMY_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/framy.jks"
      - name: Build
        env:
          ORG_GRADLE_PROJECT_framyStoreFile: ${{ runner.temp }}/framy.jks
          ORG_GRADLE_PROJECT_framyStorePassword: ${{ secrets.FRAMY_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_framyKeyAlias: ${{ secrets.FRAMY_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_framyKeyPassword: ${{ secrets.FRAMY_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_framyChatUrl: ${{ vars.CHAT_URL }}
        run: ./gradlew assembleRelease --stacktrace -PframyVersionName="${GITHUB_REF_NAME#v}" -PframyVersionCode="$GITHUB_RUN_NUMBER"
      - name: Check size and rename
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          size=$(stat -c%s "$apk")
          echo "APK size: $size bytes"
          test "$size" -lt 5242880 || { echo "::error::APK is over 5 MB"; exit 1; }
          mv "$apk" "framy-${GITHUB_REF_NAME}.apk"
          sha256sum "framy-${GITHUB_REF_NAME}.apk" > "framy-${GITHUB_REF_NAME}.apk.sha256"
          rm -f "$RUNNER_TEMP/framy.jks"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: framy-${{ github.ref_name }}.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "framy-${GITHUB_REF_NAME}.apk" "framy-${GITHUB_REF_NAME}.apk.sha256" --generate-notes --verify-tag

  chat-worker:
    name: Deploy Global chat Worker
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: chat-worker
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: chat-worker
          command: deploy
